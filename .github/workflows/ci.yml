name: CI

on:
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Check if package.json version was updated
              run: |
                  # Get the version from the current branch
                  $CURRENT_VERSION = $(jq -r '.version' package.json)

                  # Get the version from the main branch
                  git fetch origin main
                  git checkout origin/main -- package.json
                  $MAIN_VERSION = $(jq -r '.version' package.json)

                  # Restore the current package.json
                  git checkout HEAD -- package.json

                  # Check if versions are different
                  if ($CURRENT_VERSION -eq $MAIN_VERSION) {
                    Write-Host "? ERROR: La versión en package.json no ha sido actualizada"
                    Write-Host "Versión actual: $CURRENT_VERSION"
                    Write-Host "Versión en main: $MAIN_VERSION"
                    Write-Host "Por favor, actualiza la versión del paquete antes de crear el PR"
                    exit 1
                  } else {
                    Write-Host "? Versión actualizada correctamente: $MAIN_VERSION -> $CURRENT_VERSION"
                  }

            - name: Check if package.json version was updated
              run: |
                  # Get the version from the current branch
                  $CURRENT_VERSION = $(jq -r '.version' package.json)

                  # Get the version from the main branch
                  git fetch origin main
                  git checkout origin/main -- package.json
                  $MAIN_VERSION = $(jq -r '.version' package.json)

                  # Restore the current package.json
                  git checkout HEAD -- package.json

                  # Check if versions are different
                  if ($CURRENT_VERSION -eq $MAIN_VERSION) {
                    Write-Host "? ERROR: La versión en package.json no ha sido actualizada"
                    Write-Host "Versión actual: $CURRENT_VERSION"
                    Write-Host "Versión en main: $MAIN_VERSION"
                    Write-Host "Por favor, actualiza la versión del paquete antes de crear el PR"
                    exit 1
                  } else {
                    Write-Host "? Versión actualizada correctamente: $MAIN_VERSION -> $CURRENT_VERSION"
                  }

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run lint
              run: npm run lint

            - name: Type check
              run: npm run type-check

            - name: Build Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./Dockerfile
                  push: false
