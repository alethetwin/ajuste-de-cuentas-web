components:
  schemas:
    DeferredPaymentItem:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - 'https://example.com/schemas/DeferredPaymentItem.json'
          format: uri
          readOnly: true
          type: string
        deletedAt:
          description: >-
            Soft-delete tombstone. Set means deleted; tombstones are included in
            sync pulls so peers can delete locally.
          format: date-time
          type: string
        id:
          description: Client-supplied UUID.
          format: uuid
          type: string
        isCompleted:
          type: boolean
        isOpenEnded:
          description: >-
            True for recurring payments with no fixed end (e.g. monthly
            services); requiredCount is ignored and completion is manual.
          type: boolean
        name:
          type: string
        ownerRaw:
          enum:
            - Angel
            - Alejandro
          type: string
        paidCount:
          format: int64
          minimum: 0
          type: integer
        qrPayload:
          description: CODI QR payload string.
          type: string
        requiredCount:
          format: int64
          minimum: 0
          type: integer
        updatedAt:
          description: Last modification time; drives last-write-wins conflict resolution.
          format: date-time
          type: string
      required:
        - name
        - ownerRaw
        - paidCount
        - requiredCount
        - isOpenEnded
        - isCompleted
        - id
        - updatedAt
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: >-
            Where the error occurred, e.g. 'body.items[3].tags' or
            'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - 'https://example.com/schemas/ErrorModel.json'
          format: uri
          readOnly: true
          type: string
        detail:
          description: >-
            A human-readable explanation specific to this occurrence of the
            problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type:
            - array
            - 'null'
        instance:
          description: >-
            A URI reference that identifies the specific occurrence of the
            problem.
          examples:
            - 'https://example.com/error-log/abc123'
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: >-
            A short, human-readable summary of the problem type. This value
            should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: 'about:blank'
          description: A URI reference to human-readable documentation for the error.
          examples:
            - 'https://example.com/errors/example'
          format: uri
          type: string
      type: object
    Expense:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - 'https://example.com/schemas/Expense.json'
          format: uri
          readOnly: true
          type: string
        amount:
          description: >-
            Monetary amount in MXN with two decimals; handled server-side as
            exact integer cents.
          type: number
        bucketRaw:
          enum:
            - shared
            - personal_angel
            - personal_alejandro
          type: string
        concept:
          type: string
        date:
          format: date-time
          type: string
        deletedAt:
          description: >-
            Soft-delete tombstone. Set means deleted; tombstones are included in
            sync pulls so peers can delete locally.
          format: date-time
          type: string
        id:
          description: Client-supplied UUID.
          format: uuid
          type: string
        monthId:
          format: uuid
          type: string
        payerRaw:
          enum:
            - Angel
            - Alejandro
          type: string
        ticketId:
          description: >-
            Set when this expense was materialized client-side from an accepted
            ticket.
          format: uuid
          type: string
        updatedAt:
          description: Last modification time; drives last-write-wins conflict resolution.
          format: date-time
          type: string
      required:
        - concept
        - amount
        - date
        - payerRaw
        - bucketRaw
        - id
        - updatedAt
      type: object
    LoginInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - 'https://example.com/schemas/LoginInputBody.json'
          format: uri
          readOnly: true
          type: string
        password:
          type: string
        username:
          description: >-
            One of the two seeded usernames (angel, alejandro). Unknown
            usernames fail with 401, not validation, to avoid user enumeration
            semantics in the schema.
          type: string
      required:
        - username
        - password
      type: object
    LoginOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - 'https://example.com/schemas/LoginOutputBody.json'
          format: uri
          readOnly: true
          type: string
        person:
          enum:
            - Angel
            - Alejandro
          type: string
        token:
          description: Long-lived opaque bearer token. Valid until revoked.
          type: string
      required:
        - token
        - person
      type: object
    MonthPeriod:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - 'https://example.com/schemas/MonthPeriod.json'
          format: uri
          readOnly: true
          type: string
        closedSettlementAmount:
          description: >-
            Monetary amount in MXN with two decimals; handled server-side as
            exact integer cents.
          type: number
        closedSettlementPayerRaw:
          description: Frozen at close time; null means settled at zero.
          enum:
            - Angel
            - Alejandro
          type: string
        deletedAt:
          description: >-
            Soft-delete tombstone. Set means deleted; tombstones are included in
            sync pulls so peers can delete locally.
          format: date-time
          type: string
        id:
          description: Client-supplied UUID.
          format: uuid
          type: string
        isClosed:
          type: boolean
        month:
          format: int64
          maximum: 12
          minimum: 1
          type: integer
        updatedAt:
          description: Last modification time; drives last-write-wins conflict resolution.
          format: date-time
          type: string
        year:
          format: int64
          type: integer
      required:
        - year
        - month
        - isClosed
        - closedSettlementAmount
        - id
        - updatedAt
      type: object
    PushOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - 'https://example.com/schemas/PushOutputBody.json'
          format: uri
          readOnly: true
          type: string
        accepted:
          description: >-
            Number of records applied (new, or newer than the stored version).
            Stale records are skipped without error.
          format: int64
          type: integer
      required:
        - accepted
      type: object
    SyncBatch:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - 'https://example.com/schemas/SyncBatch.json'
          format: uri
          readOnly: true
          type: string
        deferredPayments:
          items:
            $ref: '#/components/schemas/DeferredPaymentItem'
          type:
            - array
            - 'null'
        expenses:
          items:
            $ref: '#/components/schemas/Expense'
          type:
            - array
            - 'null'
        months:
          items:
            $ref: '#/components/schemas/MonthPeriod'
          type:
            - array
            - 'null'
        tickets:
          items:
            $ref: '#/components/schemas/Ticket'
          type:
            - array
            - 'null'
        walletMovements:
          items:
            $ref: '#/components/schemas/WalletMovement'
          type:
            - array
            - 'null'
      type: object
    Ticket:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - 'https://example.com/schemas/Ticket.json'
          format: uri
          readOnly: true
          type: string
        createdByRaw:
          description: >-
            Who created the ticket. The creator cannot accept their own ticket;
            null (legacy) disables that check.
          enum:
            - Angel
            - Alejandro
          type: string
        date:
          format: date-time
          type: string
        deletedAt:
          description: >-
            Soft-delete tombstone. Set means deleted; tombstones are included in
            sync pulls so peers can delete locally.
          format: date-time
          type: string
        id:
          description: Client-supplied UUID.
          format: uuid
          type: string
        items:
          description: Replaced wholesale on every write; items do not sync independently.
          items:
            $ref: '#/components/schemas/TicketItem'
          type:
            - array
            - 'null'
        merchant:
          type: string
        monthId:
          format: uuid
          type: string
        paidTotal:
          description: >-
            Monetary amount in MXN with two decimals; handled server-side as
            exact integer cents.
          type: number
        payerRaw:
          enum:
            - Angel
            - Alejandro
          type: string
        reviewNote:
          type: string
        stateRaw:
          enum:
            - draft
            - pendingReview
            - accepted
          type: string
        updatedAt:
          description: Last modification time; drives last-write-wins conflict resolution.
          format: date-time
          type: string
      required:
        - merchant
        - date
        - payerRaw
        - paidTotal
        - stateRaw
        - items
        - id
        - updatedAt
      type: object
    TicketItem:
      additionalProperties: false
      properties:
        bucketRaw:
          description: Null while unassigned.
          enum:
            - shared
            - personal_angel
            - personal_alejandro
          type: string
        deletedAt:
          description: >-
            Soft-delete tombstone. Set means deleted; tombstones are included in
            sync pulls so peers can delete locally.
          format: date-time
          type: string
        id:
          description: Client-supplied UUID.
          format: uuid
          type: string
        name:
          type: string
        price:
          description: Line total (quantity × unit price).
          type: number
        quantity:
          default: 1
          format: int64
          minimum: 1
          type: integer
        updatedAt:
          description: Last modification time; drives last-write-wins conflict resolution.
          format: date-time
          type: string
      required:
        - name
        - price
        - quantity
        - id
        - updatedAt
      type: object
    TicketStateInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - 'https://example.com/schemas/TicketStateInputBody.json'
          format: uri
          readOnly: true
          type: string
        note:
          description: Attached as the review note when returning to draft.
          type: string
        state:
          enum:
            - draft
            - pendingReview
            - accepted
          type: string
      required:
        - state
      type: object
    WalletMovement:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - 'https://example.com/schemas/WalletMovement.json'
          format: uri
          readOnly: true
          type: string
        amount:
          description: >-
            Monetary amount in MXN with two decimals; handled server-side as
            exact integer cents.
          type: number
        concept:
          type: string
        date:
          format: date-time
          type: string
        deletedAt:
          description: >-
            Soft-delete tombstone. Set means deleted; tombstones are included in
            sync pulls so peers can delete locally.
          format: date-time
          type: string
        id:
          description: Client-supplied UUID.
          format: uuid
          type: string
        personRaw:
          enum:
            - Angel
            - Alejandro
          type: string
        typeRaw:
          enum:
            - deposit
            - spend
          type: string
        updatedAt:
          description: Last modification time; drives last-write-wins conflict resolution.
          format: date-time
          type: string
      required:
        - typeRaw
        - personRaw
        - concept
        - amount
        - date
        - id
        - updatedAt
      type: object
  securitySchemes:
    bearerAuth:
      scheme: bearer
      type: http
info:
  description: >-
    Sync backend for the Ajuste de Cuentas iOS app. Exactly two pre-seeded users
    (angel, alejandro); no registration. All non-auth endpoints require a bearer
    token. Sync semantics: last-write-wins on per-record `updatedAt`; deletions
    are soft-delete tombstones (`deletedAt`) which propagate through /sync/pull
    and /sync/push. Accepting a ticket does not create expenses server-side: the
    accepting client materializes expenses and syncs them as ordinary expense
    records linked by `ticketId`. This document is generated from the server
    code; do not edit it by hand.
  title: Ajuste de Cuentas API
  version: 2.0.0
openapi: 3.1.0
paths:
  /auth/login:
    post:
      description: >-
        The only unauthenticated endpoint. No registration exists; the two users
        are seeded server-side.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInputBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOutputBody'
          description: OK
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unauthorized
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unprocessable Entity
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Internal Server Error
      security: []
      summary: Exchange credentials for a long-lived bearer token
      tags:
        - auth
  /deferred-payments:
    get:
      description: >-
        Returns live records only; tombstoned records are excluded. Use
        /sync/pull to receive tombstones.
      operationId: list-deferred-payments
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DeferredPaymentItem'
                type:
                  - array
                  - 'null'
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: List deferred/recurring payment items
      tags:
        - deferred_items
  '/deferred-payments/{id}':
    delete:
      description: >-
        Sets the `deletedAt` tombstone rather than removing the row, so the
        deletion propagates to the other device via sync. Idempotent.
      operationId: delete-deferred-payments
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '204':
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Delete a deferred payment item (soft delete)
      tags:
        - deferred_items
    get:
      operationId: get-deferred-payments
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeferredPaymentItem'
          description: OK
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Not Found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unprocessable Entity
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Internal Server Error
      summary: Get a deferred payment item
      tags:
        - deferred_items
    put:
      description: >-
        Clients own record identity: the body carries the client-generated UUID
        and `updatedAt`.
      operationId: put-deferred-payments
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeferredPaymentItem'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeferredPaymentItem'
          description: OK
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unprocessable Entity
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Internal Server Error
      summary: Create or replace a deferred payment item
      tags:
        - deferred_items
  /expenses:
    get:
      description: >-
        Returns live records only; tombstoned records are excluded. Use
        /sync/pull to receive tombstones.
      operationId: list-expenses
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Expense'
                type:
                  - array
                  - 'null'
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: List expenses
      tags:
        - expenses
  '/expenses/{id}':
    delete:
      description: >-
        Sets the `deletedAt` tombstone rather than removing the row, so the
        deletion propagates to the other device via sync. Idempotent.
      operationId: delete-expenses
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '204':
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Delete a expense (soft delete)
      tags:
        - expenses
    get:
      operationId: get-expenses
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
          description: OK
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Not Found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unprocessable Entity
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Internal Server Error
      summary: Get a expense
      tags:
        - expenses
    put:
      description: >-
        Clients own record identity: the body carries the client-generated UUID
        and `updatedAt`.
      operationId: put-expenses
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Expense'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
          description: OK
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unprocessable Entity
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Internal Server Error
      summary: Create or replace a expense
      tags:
        - expenses
  /months:
    get:
      description: >-
        Returns live records only; tombstoned records are excluded. Use
        /sync/pull to receive tombstones.
      operationId: list-months
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/MonthPeriod'
                type:
                  - array
                  - 'null'
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: List all month periods
      tags:
        - months
  '/months/{id}':
    delete:
      description: >-
        Sets the `deletedAt` tombstone rather than removing the row, so the
        deletion propagates to the other device via sync. Idempotent.
        Soft-deletes the month and cascade-tombstones its expenses and tickets.
      operationId: delete-months
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '204':
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Delete a month (soft delete)
      tags:
        - months
    get:
      operationId: get-months
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthPeriod'
          description: OK
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Not Found
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unprocessable Entity
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Internal Server Error
      summary: Get a month
      tags:
        - months
    put:
      description: >-
        Clients own record identity: the body carries the client-generated UUID
        and `updatedAt`.
      operationId: put-months
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonthPeriod'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthPeriod'
          description: OK
        '422':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Unprocessable Entity
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Internal Server Error
      summary: Create or replace a month
      tags:
        - months
  /sync/pull:
    get:
      description: >-
        Includes soft-deleted records (with `deletedAt` set) so the client can
        propagate deletions locally.
      operationId: sync-pull
      parameters:
        - description: Return records modified strictly after this instant (RFC 3339).
          explode: false
          in: query
          name: since
          required: true
          schema:
            description: Return records modified strictly after this instant (RFC 3339).
            format: date-time
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncBatch'
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Pull all records modified after a given timestamp
      tags:
        - sync
  /sync/push:
    post:
      description: >-
        Per-record last-write-wins on `updatedAt`: newer records replace stored
        ones, stale records are skipped. Records with `deletedAt` set apply as
        deletions under the same rule. Ticket items are replaced wholesale with
        their parent ticket.
      operationId: sync-push
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncBatch'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushOutputBody'
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error
      summary: Push locally created or modified records
      tags:
        - sync
  /tickets:
    get:
      description: >-
        Returns live records only; tombstoned records are excluded. Use
        /sync/pull to receive tombstones.
      operationId: list-tickets
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
