  '/tickets/{id}/state':
    post:
      description: >-
        Valid transitions: draft → pendingReview, pendingReview → accepted,
        pendingReview → draft, accepted → draft. The ticket's creator cannot
        accept their own ticket (422) when `createdByRaw` is known. Accepting
        does not create expenses server-side; the accepting client materializes
        expenses and syncs them with `ticketId` set.
      operationId: transition-ticket-state
